[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findupto-ai"
version = "0.1.0"
description = "Standalone local-first AI desktop platform"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pypdf>=5.0",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3.0"]
web = ["requests>=2.32"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
findupto-ai = "apps.desktop:main"

[tool.setuptools.packages.find]
include = ["apps*", "orchestrator*", "models*", "knowledge*", "memory*", "tools*", "security*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]