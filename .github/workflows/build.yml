name: Build Findupto AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'config/**'
      - 'pyproject.toml'
      - 'infra/**'
      - '.github/workflows/build.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -e '.[local,dev]'
      - name: Build EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean infra/FinduptoAI.spec
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist\FinduptoAI\models' | Out-Null
          New-Item -ItemType Directory -Force -Path 'dist\FinduptoAI\data' | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: FinduptoAI-Windows
          path: dist/FinduptoAI/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[local,dev]'
      - name: Build
        run: python -m PyInstaller --noconfirm --clean infra/FinduptoAI.spec
      - uses: actions/upload-artifact@v4
        with:
          name: FinduptoAI-Linux
          path: dist/FinduptoAI/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[local,dev]'
      - name: Build
        run: python -m PyInstaller --noconfirm --clean infra/FinduptoAI.spec
      - uses: actions/upload-artifact@v4
        with:
          name: FinduptoAI-macOS
          path: dist/FinduptoAI/
